# Runtime Node cho app TypeScript: node:24 (ADR-001). Service app thêm ở task sau.
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: studio
      POSTGRES_PASSWORD: studio
      POSTGRES_DB: studio
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studio -d studio"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  tts:
    profiles: ["cpu"]
    build:
      context: ./services/tts
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATA_DIR: /data
      HF_HOME: /cache/huggingface
      VIENEU_BACKEND: onnx
      VIENEU_PRECISION: fp32
      TTS_DEFAULT_VOICE: "Mai Anh"
      TTS_PRELOAD_MODEL: "1"
      WHISPER_CACHE_DIR: /cache/whisper
    volumes:
      - ./data:/data
      - tts_hf_cache:/cache/huggingface
      - tts_whisper_cache:/cache/whisper
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request,sys; r=urllib.request.urlopen('http://127.0.0.1:8000/health',timeout=5); sys.exit(0 if b'\"status\":\"ok\"' in r.read() else 1)",
        ]
      interval: 30s
      timeout: 10s
      start_period: 600s
      retries: 10

  video-render:
    profiles: ["render"]
    build:
      context: .
      dockerfile: apps/video/Dockerfile
    environment:
      DATA_DIR: /data
    volumes:
      - ./data:/data
    shm_size: "1gb"

volumes:
  postgres_data:
  tts_hf_cache:
  tts_whisper_cache:
