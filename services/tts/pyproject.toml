[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[project]
name = "studio-tts"
version = "0.1.0"
description = "AI Content Studio TTS facade (VieNeu-TTS v3 Turbo, CPU/ONNX)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.32,<1",
  "pydantic>=2.10,<3",
  "vieneu==3.8.3",
]

[project.optional-dependencies]
align = [
  "numpy>=2,<3",
  "soundfile>=0.13,<1",
  "torch>=2.5,<3",
  "torchaudio>=2.5,<3",
  "transformers>=4.46,<5",
]
align-whisper = [
  "stable-ts>=2.17,<3",
  "openai-whisper>=20240930",
]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.3,<9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "integration: requires model download and inference (set TTS_INTEGRATION=1)",
]
